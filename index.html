<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthioViral - Start Growing Today</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="flex flex-col lg:flex-row min-h-screen">
    
    <!-- Left Side: Wallpaper -->
    <div class="lg:w-[60%] w-full h-[40vh] lg:h-screen bg-cover bg-center relative" style="background-image: url('./assets/wallpaper.jpg');">
        <!-- Overlay for better text readability if needed -->
        <div class="absolute inset-0 bg-black bg-opacity-20"></div>
        
        <!-- Logo Area -->
        <div class="absolute top-8 left-8 flex items-center z-10">
            <div class="text-white text-2xl font-bold flex items-center gap-2">
                <!-- SVG Logo placeholder (Green Shield/Check) -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 6V12C3 17.55 6.84 22.74 12 24C17.16 22.74 21 17.55 21 12V6L12 2Z" fill="#10B981"/>
                    <path d="M10.5 16.5L6.5 12.5L7.91 11.09L10.5 13.67L16.09 8.09L17.5 9.5L10.5 16.5Z" fill="white"/>
                </svg>
                EthioViral
            </div>
        </div>

        <!-- Left side footer links (Terms, Privacy, etc.) -->
        <div class="absolute bottom-8 left-8 flex gap-6 text-sm text-gray-300 font-medium z-10 hidden lg:flex">
            <a href="#" class="hover:text-white transition">Terms of Service</a>
            <a href="#" class="hover:text-white transition">Privacy Policy</a>
            <a href="#" class="hover:text-white transition">Compliance</a>
        </div>
    </div>

    <!-- Right Side: Action Widget -->
    <div class="lg:w-[40%] w-full flex flex-col justify-center items-center p-8 relative min-h-screen lg:min-h-0 bg-white">
        
        <!-- Top Right Navigation -->
        <div class="absolute top-8 right-8 flex items-center gap-6 text-sm font-medium">
            <a href="#" class="text-gray-900 hover:text-gray-600 transition">Contact</a>
            <a href="#" class="bg-black text-white px-5 py-2.5 rounded-full hover:bg-gray-800 transition shadow-md">Get started</a>
        </div>

        <!-- Main Content Wrapper -->
        <div class="max-w-[420px] w-full mt-16 lg:mt-0">
            <h1 class="text-4xl lg:text-[42px] font-bold text-gray-900 leading-tight mb-8 text-center lg:text-left tracking-tight">
                Grow your reach <br/>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-500 to-green-400">fast and secure</span>
            </h1>

            <!-- Widget Card -->
            <div class="bg-white rounded-3xl p-6 lg:p-8 shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-gray-100">
                
                <!-- Tabs -->
                <div class="flex bg-gray-100 p-1 rounded-2xl mb-8">
                    <button class="flex-1 bg-white shadow-sm text-gray-900 font-semibold py-2.5 rounded-xl text-sm transition">Followers</button>
                    <button class="flex-1 text-gray-500 font-medium py-2.5 rounded-xl text-sm hover:text-gray-900 transition">Views</button>
                    <button class="flex-1 text-gray-500 font-medium py-2.5 rounded-xl text-sm hover:text-gray-900 transition">Likes</button>
                </div>

                <!-- Input Group: You want -->
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-900 mb-3">Service</label>
                    <div class="flex items-center justify-between border border-gray-200 rounded-2xl p-4 hover:border-gray-300 transition cursor-pointer">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-pink-500 to-orange-400 flex items-center justify-center text-white">
                                <!-- Instagram icon -->
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                            </div>
                            <div>
                                <div class="font-bold text-gray-900">Instagram</div>
                                <div class="text-xs text-gray-500">Premium Followers</div>
                            </div>
                        </div>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </div>

                <!-- Swap icon separator -->
                <div class="flex justify-center -my-2 relative z-10">
                    <div class="bg-gray-50 rounded-full p-2 border border-gray-100 shadow-sm text-gray-400">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                    </div>
                </div>

                <!-- Input Group: Amount -->
                <div class="mt-4 mb-6">
                    <label class="block text-sm font-semibold text-gray-900 mb-3">Amount</label>
                    <div class="flex items-center justify-between border border-gray-200 rounded-2xl p-4">
                        <input type="text" value="1,000" class="text-3xl font-bold text-gray-900 outline-none w-1/2 bg-transparent" readonly>
                        <div class="text-right">
                            <div class="text-2xl font-bold text-gray-900">$1.50</div>
                            <div class="text-xs text-gray-500 mt-1">Est. delivery: 1-2 hrs</div>
                        </div>
                    </div>
                </div>

                <div class="text-center text-xs text-gray-500 font-medium mb-6">
                    Secure checkout via Telebirr or Card
                </div>

                <button class="w-full bg-black text-white font-semibold py-4 rounded-2xl text-base hover:bg-gray-800 transition shadow-lg transform hover:-translate-y-0.5">
                    Order Now
                </button>
            </div>
            
            <div class="mt-8 text-center text-xs font-medium text-gray-400 lg:hidden">
                © 2026 EthioViral. All rights reserved.
            </div>
        </div>
        
        <div class="absolute bottom-8 text-xs font-medium text-gray-400 hidden lg:block">
            © 2026 EthioViral. All rights reserved.
        </div>
    </div>
</body>
</html>
